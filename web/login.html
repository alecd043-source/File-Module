<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0f766e">
  <title>Anmelden · {{.Name}}</title>
  <link rel="stylesheet" href="/assets/app.css?v={{.Version}}">
  <link rel="icon" href="/assets/icon.svg?v={{.Version}}" type="image/svg+xml">
  <link rel="manifest" href="/assets/manifest.webmanifest?v={{.Version}}">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="loginTitle">
      <h1 id="loginTitle">File Server</h1>
      

      {{if .Error}}
      <div class="alert" role="alert">{{.Error}}</div>
      {{end}}

      <form class="login-form" method="post" action="/login">
        <label class="field">
          <span>Benutzername</span>
          <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </label>
        <label class="field">
          <span>Passwort</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary login-button" type="submit">Anmelden</button>
      </form>

      
    </section>
  </main>
</body>
</html>
